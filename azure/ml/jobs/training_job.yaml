$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

experiment_name: video-editorial-fine-tuning
display_name: peft-lora-distilbert-training
description: Parameter-Efficient Fine-Tuning of Multi-Head Video Editorial Transformer

code: ../../
command: >-
  python -m src.train
  --base-model ${{inputs.base_model}}
  --output-dir ${{outputs.model_output}}
  --epochs ${{inputs.epochs}}
  --batch-size ${{inputs.batch_size}}
  --lr ${{inputs.learning_rate}}
  --device cuda

environment: azureml:video-editorial-env:1
compute: azureml:gpu-cluster-v100

inputs:
  base_model: "distilbert-base-uncased"
  epochs: 3
  batch_size: 8
  learning_rate: 0.0002

outputs:
  model_output:
    type: custom_model
    mode: rw_mount

